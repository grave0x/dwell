name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  system-deps:
    runs-on: ubuntu-latest
    outputs:
      deps-cache: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libssl-dev \
            libssh2-1-dev \
            liblua5.4-dev \
            libz-dev \
            cmake

  check:
    runs-on: ubuntu-latest
    needs: [system-deps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libssh2-1-dev liblua5.4-dev libz-dev cmake

      - name: Check
        run: cargo check --workspace

      - name: Lint (clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    needs: [system-deps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libssh2-1-dev liblua5.4-dev libz-dev cmake

      - name: Unit & integration tests
        run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    needs: [system-deps]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libssh2-1-dev liblua5.4-dev libz-dev cmake

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dwell-linux-x86_64
          path: target/release/dwell-cli
