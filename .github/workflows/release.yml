name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_DIR: target-cross

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dwell-cli-${{ matrix.target }}
          path: target-cross/${{ matrix.target }}/release/dwell-cli
          if-no-files-found: error

  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --output dwell-amd64.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: dwell-amd64.deb
          path: dwell-amd64.deb

  aur:
    name: Build AUR package
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Generate PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp packaging/aur/PKGBUILD .
          sed -i "s/{{VERSION}}/$VERSION/g" PKGBUILD
          echo "PKGBUILD generated for v$VERSION"

      - name: Upload PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: PKGBUILD
          path: PKGBUILD

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Generate formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > dwell.rb <<EOF
          class Dwell < Formula
            desc "Dotfile manager with type-safe modules and cross-platform packages"
            homepage "https://github.com/grave0x/dwell"
            url "https://github.com/grave0x/dwell/archive/refs/tags/v${VERSION}.tar.gz"
            license "MIT"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "dwell", shell_output("#{bin}/dwell --version")
            end
          end
          EOF
          echo "Formula generated"

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: dwell.rb
          path: dwell.rb

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deb, aur, homebrew]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dwell-cli-* dwell-amd64.deb > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dwell-cli-*
            dwell-amd64.deb
            PKGBUILD
            dwell.rb
            SHA256SUMS
          generate_release_notes: true
