[package]
name = "dwell-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unify your dotfiles across machines with type-safe modules, cross-platform packages, and a plugin system"
homepage.workspace = true
repository.workspace = true

[package.metadata.deb]
maintainer = "grave0x <grave@grave0x>"
extended-description = """\
dwell is a dotfile manager that helps you unify configuration across machines. \
It supports multiple template engines (Handlebars, Rhai, Tera), cross-platform \
package management, secret encryption with age, and a plugin system with WASM and Lua.\
"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/dwell-cli", "usr/bin/dwell", "755"],
]

[dependencies]
dwell-core.workspace = true
dwell-store.workspace = true
dwell-template.workspace = true
dwell-deploy.workspace = true
dwell-module.workspace = true
dwell-package.workspace = true
dwell-secrets.workspace = true
dwell-plugin.workspace = true
clap.workspace = true
indicatif.workspace = true
console.workspace = true
dialoguer.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
hostname = "0.4"
git2.workspace = true

[dev-dependencies]
git2.workspace = true
